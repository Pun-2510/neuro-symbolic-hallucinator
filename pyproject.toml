# =====================================================================
# pyproject.toml — packaging + tooling config
# =====================================================================

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "essay-integrity-checker"
version = "3.2.0"
description = "Neuro-Symbolic system for citation integrity scoring and hallucinated reference detection in student essays"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic[email]>=2.6,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "PyYAML>=6.0,<7.0",
    "python-dotenv>=1.0,<2.0",
    "typing-extensions>=4.9,<5.0",
    "httpx>=0.27,<1.0",
    "requests>=2.31,<3.0",
    "aiohttp>=3.9,<4.0",
    "aiofiles>=23.2,<25.0",
    "PyMuPDF>=1.24,<2.0",
    "pdfplumber>=0.10,<1.0",
    "sentence-transformers>=2.6,<4.0",
    "rapidfuzz>=3.6,<4.0",
    "arxiv>=2.0,<3.0",
    "google-search-results>=2.1,<3.0",
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.27,<1.0",
    "python-multipart>=0.0.9,<1.0",
    "bcrypt>=4.0,<5.0",
    "pyjwt>=2.0,<3.0",
    "docker>=7.0,<8.0",
    "SQLAlchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "reportlab>=4.0,<5.0",
    "python-docx>=1.1,<2.0",
    "tenacity>=8.2,<9.0",
    "loguru>=0.7,<1.0",
    "defusedxml>=0.7,<1.0",
]
license = { text = "MIT" }
authors = [
    { name = "Nguyễn Bảo Minh", email = "523H0054@student.tdtu.edu.vn" },
    { name = "Trần Gia Thành", email = "523H0096@student.tdtu.edu.vn" },
]
keywords = ["citation", "hallucination", "neuro-symbolic", "nlp", "education"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.scripts]
essay-check = "integrity_checker.pipeline.integrity_pipeline:main"

# --- Tooling ---

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["web/", "node_modules/", "build/", "dist/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "ASYNC", "SIM"]
ignore = ["E501"]  # line-length handled by formatter

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-v --tb=short --strict-markers -m 'not slow'"
markers = [
    "integration: tests cần network/IO thật",
    "slow: tests chậm (skipped by default)",
    "asyncio: async tests",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["integrity_checker*"]
