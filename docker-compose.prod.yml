# =====================================================================
# docker-compose.prod.yml — Essay Integrity Checker (Production)
#
# Usage:
#   docker compose -f docker-compose.prod.yml up --build -d
#   docker compose -f docker-compose.prod.yml ps
#   docker compose -f docker-compose.prod.yml logs -f api web
# =====================================================================

services:
  # ---------------------------------------------------------------------------
  # GROBID — PDF reference extraction service (internal network + localhost)
  # ---------------------------------------------------------------------------
  grobid:
    image: lfoppiano/grobid:0.8.0
    container_name: essay-check-grobid
    ports:
      - "127.0.0.1:8070:8070"
    environment:
      - JAVA_OPTS=-Xmx2g -XX:-UseContainerSupport
      - JDK_JAVA_OPTIONS=-Xmx2g -XX:-UseContainerSupport
    platform: linux/amd64
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 3G
        reservations:
          memory: 2G
    networks:
      - essay-check-net
    volumes:
      - grobid-cache:/opt/grobid/grobid-home/cache
    healthcheck:
      test:
        - CMD-SHELL
        - 'bash -c ''exec 3<>/dev/tcp/127.0.0.1/8070 && printf "GET /api/isalive HTTP/1.0\r\n\r\n" >&3 && head -1 <&3 | grep -q 200'''
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  # ---------------------------------------------------------------------------
  # API — FastAPI backend (Production: no --reload, no source bind mounts)
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: integrity-api
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
      - ./configs/config.docker.yaml:/app/configs/config.yaml:ro
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      grobid:
        condition: service_healthy
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_LOG_LEVEL=${APP_LOG_LEVEL:-WARNING}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set to a strong secret in production}
      - GROBID_URL=http://grobid:8070
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./data/app.db}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health',timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - essay-check-net
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
    command: >
      uvicorn integrity_checker.api.main:app
      --host 0.0.0.0
      --port 8000
      --workers ${UVICORN_WORKERS:-1}
      --proxy-headers
      --forwarded-allow-ips="*"

  # ---------------------------------------------------------------------------
  # Web — Nginx Static SPA + /api Reverse Proxy
  # ---------------------------------------------------------------------------
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    container_name: integrity-web
    ports:
      - "${WEB_PORT:-80}:80"
      - "443:443"
    volumes:
      - ./web/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - essay-check-net

networks:
  essay-check-net:
    driver: bridge

volumes:
  grobid-cache:
    driver: local
