# =====================================================================
# docker-compose.yml — local dev: api + frontend + GROBID
# GROBID: lfoppiano/grobid:0.8.0 (cần 2GB+ RAM)
# =====================================================================

services:
  grobid:
    image: lfoppiano/grobid:0.8.0
    container_name: essay-check-grobid
    ports:
      - "8070:8070"
      - "8071:8071"
    environment:
      - JAVA_OPTS=-Xmx2g
    volumes:
      - grobid_data:/opt/grobid
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8070/api/isalive"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 3G
        reservations:
          memory: 2G

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: integrity-api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./configs:/app/configs
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      grobid:
        condition: service_healthy

  web:
    image: node:20-alpine
    container_name: integrity-web
    working_dir: /app/web
    ports:
      - "5173:5173"
    volumes:
      - ./web:/app/web
      - /app/web/node_modules
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  grobid_data:
