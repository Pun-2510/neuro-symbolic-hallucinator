# =====================================================================
# docker-compose.yml — local dev: api + frontend
# GROBID không có ở MVP (chỉ PyMuPDF + pdfplumber).
# =====================================================================

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: integrity-api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./configs:/app/configs
    env_file:
      - .env
    restart: unless-stopped

  web:
    image: node:20-alpine
    container_name: integrity-web
    working_dir: /app/web
    ports:
      - "5173:5173"
    volumes:
      - ./web:/app/web
      - /app/web/node_modules
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - api
    restart: unless-stopped
