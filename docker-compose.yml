# =====================================================================
# docker-compose.yml — Essay Integrity Checker
# Full Docker setup: API + Frontend + GROBID
#
# Usage:
#   docker-compose up --build        # Start all services
#   docker-compose up --build -d     # Start in background
#   docker-compose logs -f api       # Watch API logs
#   docker-compose exec api pytest   # Run tests in container
#   docker-compose down              # Stop all services
# =====================================================================

services:
  # ---------------------------------------------------------------------------
  # GROBID — PDF reference extraction service
  # ---------------------------------------------------------------------------
  grobid:
    image: lfoppiano/grobid:0.8.0
    container_name: essay-check-grobid
    ports:
      - "8070:8070"  # GROBID API
    environment:
      - JAVA_OPTS=-Xmx2g -XX:-UseContainerSupport
      - JDK_JAVA_OPTIONS=-Xmx2g -XX:-UseContainerSupport
    platform: linux/amd64
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 3G
        reservations:
          memory: 2G
    networks:
      - essay-check-net
    volumes:
      - grobid-cache:/opt/grobid/grobid-home/cache
    healthcheck:
      # Grobid image has no curl/wget (and `sh` is dash, no /dev/tcp) — probe
      # with bash's /dev/tcp instead.
      test:
        - CMD-SHELL
        - 'bash -c ''exec 3<>/dev/tcp/127.0.0.1/8070 && printf "GET /api/isalive HTTP/1.0\r\n\r\n" >&3 && head -1 <&3 | grep -q 200'''
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  # ---------------------------------------------------------------------------
  # API — FastAPI backend
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: integrity-api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./configs/config.docker.yaml:/app/configs/config.yaml:ro  # Override with Docker config
      - ./tests:/app/tests:ro  # Read-only tests
      # Hot-reload: mount source code live (no rebuild needed)
      - ./src:/app/src:ro
      - ./pyproject.toml:/app/pyproject.toml:ro
      - ./.env:/app/.env:ro
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      grobid:
        condition: service_started
    environment:
      - GROBID_URL=http://grobid:8070  # Docker internal network
      - DATABASE_URL=sqlite:///./data/app.db
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-429053368516-7uia3j5uavajvbkhd7hq6lih9a65n22u.apps.googleusercontent.com}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
    healthcheck:
      # Health lives under /api (the app is mounted there), not at the root.
      test: ["CMD", "python", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health',timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - essay-check-net
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
    # Hot-reload: override CMD to add --reload flag (watch only /app/src so
    # test edits or SQLite writes in /app/data don't restart the server)
    command: uvicorn integrity_checker.api.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/src

  # ---------------------------------------------------------------------------
  # Web — React frontend (Vite dev server)
  # ---------------------------------------------------------------------------
  web:
    image: node:20-alpine
    container_name: integrity-web
    working_dir: /app/web
    ports:
      - "5173:5173"  # Vite dev server
    volumes:
      - ./web:/app/web
    environment:
      # Use proxy (/api) - Vite forwards directly over Docker bridge network to api:8000
      - VITE_API_BASE_URL=/api
      - VITE_API_PROXY_TARGET=http://api:8000
      - VITE_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-429053368516-7uia3j5uavajvbkhd7hq6lih9a65n22u.apps.googleusercontent.com}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: >
      sh -c "npm install --legacy-peer-deps &&
             npm run dev -- --host 0.0.0.0"
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - essay-check-net

# ---------------------------------------------------------------------------
# Networks
# ---------------------------------------------------------------------------
networks:
  essay-check-net:
    driver: bridge

# ---------------------------------------------------------------------------
# Volumes (persisted data)
# ---------------------------------------------------------------------------
volumes:
  grobid-cache:
    driver: local
