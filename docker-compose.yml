# =====================================================================
# docker-compose.yml — local dev: api + frontend + GROBID
# GROBID: lfoppiano/grobid:0.8.0 (cần 2GB+ RAM)
# GROBID chỉ expose internal, API kết nối qua Docker internal network
# =====================================================================

services:
  grobid:
    image: lfoppiano/grobid:0.8.0
    container_name: essay-check-grobid
    expose:
      - "8070"   # Internal only - API connects via Docker network
      - "8071"
    environment:
      - JAVA_OPTS=-Xmx2g
    volumes:
      - grobid_data:/opt/grobid
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8070/api/isalive"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 3G
        reservations:
          memory: 2G
    networks:
      - internal

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: integrity-api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./configs:/app/configs
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      grobid:
        condition: service_healthy
    environment:
      - GROBID_URL=http://grobid:8070  # Internal Docker network
    networks:
      - internal

  web:
    image: node:20-alpine
    container_name: integrity-web
    working_dir: /app/web
    ports:
      - "5173:5173"
    volumes:
      - ./web:/app/web
      - /app/web/node_modules
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - api
    restart: unless-stopped

networks:
  internal:
    driver: bridge
    internal: false  # Allow external for dev, set to true for production

volumes:
  grobid_data:
