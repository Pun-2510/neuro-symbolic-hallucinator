# =====================================================================
# web/nginx.prod.conf — Nginx HTTPS + HTTP/2 Production Configuration
# Domain: citra.io.vn (with Let's Encrypt TLS & internal healthcheck)
# =====================================================================

# 1. HTTP -> HTTPS redirect for citra.io.vn & www.citra.io.vn (+ ACME challenge)
server {
    listen 80;
    server_name citra.io.vn www.citra.io.vn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://citra.io.vn$request_uri;
    }
}

# 2. Default HTTP server for Docker internal healthcheck (127.0.0.1) & IP access
server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 30M;

    resolver 127.0.0.11 valid=30s ipv6=off;

    location /api/ {
        set $backend_upstream http://api:8000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# 3. Canonical redirect: https://www.citra.io.vn -> https://citra.io.vn
server {
    listen 443 ssl;
    http2 on;
    server_name www.citra.io.vn;

    ssl_certificate /etc/letsencrypt/live/citra.io.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/citra.io.vn/privkey.pem;

    return 301 https://citra.io.vn$request_uri;
}

# 4. Primary HTTPS server: https://citra.io.vn
server {
    listen 443 ssl;
    http2 on;
    server_name citra.io.vn;

    ssl_certificate /etc/letsencrypt/live/citra.io.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/citra.io.vn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /usr/share/nginx/html;
    index index.html;

    # Allow PDF essay uploads up to 30 MB (backend limit is 25 MB)
    client_max_body_size 30M;

    # Gzip compression (Level 6 optimal CPU/size ratio)
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/rss+xml
        application/atom+xml
        application/manifest+json
        font/woff2
        image/svg+xml;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Docker internal DNS resolver so Nginx starts cleanly and re-resolves container IPs
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Reverse proxy API requests to FastAPI backend (HTTP/1.1 Keep-Alive)
    location /api/ {
        set $backend_upstream http://api:8000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Immutable cache for hashed static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Cache root-level brand icons and logos
    location ~* ^/(citra-logo\.png|favicon\.(png|ico)|apple-touch-icon\.png)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Serve SEO crawl files directly
    location = /robots.txt {
        try_files $uri =404;
    }

    location = /sitemap.xml {
        try_files $uri =404;
    }

    # SPA fallback for React Router
    location / {
        try_files $uri $uri/ /index.html;
    }
}
