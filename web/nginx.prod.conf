# =====================================================================
# web/nginx.prod.conf — Nginx HTTPS + HTTP/2 Production Configuration
# Domain: citra.io.vn (with Let's Encrypt TLS, Rate-Limiting & Security Headers)
# =====================================================================

server_tokens off;

# Rate limiting zone for authentication endpoints (30 req/min per IP + burst 30)
limit_req_zone $binary_remote_addr zone=citra_auth_limit:10m rate=30r/m;
limit_req_status 429;

# 1. HTTP -> HTTPS redirect for citra.io.vn & www.citra.io.vn (+ ACME challenge)
server {
    listen 80;
    server_name citra.io.vn www.citra.io.vn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://citra.io.vn$request_uri;
    }
}

# 2. Default HTTP server for Docker internal healthcheck (127.0.0.1) & IP access
server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 30M;

    resolver 127.0.0.11 valid=30s ipv6=off;

    location /api/ {
        set $backend_upstream http://api:8000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# 3. Canonical redirect: https://www.citra.io.vn -> https://citra.io.vn
server {
    listen 443 ssl;
    http2 on;
    server_name www.citra.io.vn;

    ssl_certificate /etc/letsencrypt/live/citra.io.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/citra.io.vn/privkey.pem;

    return 301 https://citra.io.vn$request_uri;
}

# 4. Primary HTTPS server: https://citra.io.vn
server {
    listen 443 ssl;
    http2 on;
    server_name citra.io.vn;

    ssl_certificate /etc/letsencrypt/live/citra.io.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/citra.io.vn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /usr/share/nginx/html;
    index index.html;

    # Allow PDF essay uploads up to 30 MB (backend limit is 25 MB)
    client_max_body_size 30M;

    # Gzip compression (Level 6 optimal CPU/size ratio)
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/rss+xml
        application/atom+xml
        application/manifest+json
        font/woff2
        image/svg+xml;

    # Server-level security headers (for proxied /api/ and SEO files without child add_header)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://api.fontshare.com https://accounts.google.com; font-src 'self' https://fonts.gstatic.com https://cdn.fontshare.com data:; img-src 'self' data: blob: https:; connect-src 'self' https: https://accounts.google.com https://oauth2.googleapis.com https://www.googleapis.com; frame-src 'self' https://accounts.google.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://accounts.google.com;" always;

    # Docker internal DNS resolver so Nginx starts cleanly and re-resolves container IPs
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Rate-limited authentication endpoints to prevent brute-force & registration spam
    location ~ ^/api/auth/(login|google|register|forgot-password|resend-activation)$ {
        limit_req zone=citra_auth_limit burst=30 nodelay;
        set $backend_upstream http://api:8000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Reverse proxy API requests to FastAPI backend (HTTP/1.1 Keep-Alive)
    location /api/ {
        set $backend_upstream http://api:8000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Immutable cache for hashed static assets, self-hosted fonts & Solva editorial paintings (+ full security headers preserved)
    location ~ ^/(assets|fonts|solva)/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri =404;
    }

    # Cache root-level brand icons, logos, and webmanifest (+ full security headers preserved)
    location ~* ^/(citra-logo\.png|favicon\.(png|ico)|apple-touch-icon\.png|manifest\.webmanifest)$ {
        add_header Cache-Control "public, max-age=604800";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri =404;
    }

    # Serve SEO crawl files directly
    location = /robots.txt {
        try_files $uri =404;
    }

    location = /sitemap.xml {
        try_files $uri =404;
    }

    # SPA fallback for React Router (no-cache on index.html so new deploys take effect immediately)
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://api.fontshare.com https://accounts.google.com; font-src 'self' https://fonts.gstatic.com https://cdn.fontshare.com data:; img-src 'self' data: blob: https:; connect-src 'self' https: https://accounts.google.com https://oauth2.googleapis.com https://www.googleapis.com; frame-src 'self' https://accounts.google.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://accounts.google.com;" always;
        try_files $uri $uri/ /index.html;
    }
}
